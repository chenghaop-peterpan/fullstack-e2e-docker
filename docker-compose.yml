services:
  # 1. PostgreSQL 資料庫
  db:
    image: postgres:16-alpine
    container_name: fs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-expense_db}
    volumes:
      - fs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-expense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI 後端服務
  api:
    build: ./backend
    container_name: fs-api
    restart: always
    ports:
      - "8030:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-supersecretpassword}@db:5432/${POSTGRES_DB:-expense_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

# 3. Nginx 前端 + 反向代理服務
  web:
    build: ./frontend
    container_name: fs-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Playwright 端對端自動化測試專職容器（使用 test profile，需主動觸發才執行）
  e2e-tester:
    build: ./test
    container_name: fs-e2e-tester
    profiles: ["test"]
    environment:
      BASE_URL: "http://web"
    volumes:
      - ./reports:/app/reports
    depends_on:
      web:
        condition: service_healthy

volumes:
  fs_postgres_data: